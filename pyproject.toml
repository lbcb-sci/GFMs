[project]
name = "GLMs"
version = "0.1.0"
description = "Analysis of Genomic Foundation Models (mostly their embeddings)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "accelerate>=1.12.0",
    "datasets>=4.4.2",
    "genomic-benchmarks>=1.0.0",
    "gpustat>=1.1.1",
    "matplotlib>=3.10.8",
    "numpy>=2.2.6",
    "scikit-bio>=0.7.1.post1",
    "scikit-learn>=1.7.2",
    "torch>=2.9.1",
    "transformers>=4.57.3",
]
